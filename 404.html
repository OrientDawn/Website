    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function()
        {
            function createStars()
            {
                const starsContainer = document.querySelector('.stars-container');
                const starCount = 80;
                
                for (let i = 0; i < starCount; i++)
                {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    const size = Math.random() * 3 + 1 + 2;
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    
                    const delay = Math.random() * 3 + 's';
                    const duration = Math.random() * 2 + 1 + 's';
                    star.style.animationDelay = delay;
                    star.style.animationDuration = duration;
                    
                    const colors = ['#FFD700', '#FFA500', '#FFE4B5', '#FFFF00', '#FFD300'];
                    star.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    star.style.boxShadow = `0 0 ${size * 2}px ${size}px rgba(255, 215, 0, 0.4)`;
                    
                    starsContainer.appendChild(star);
                }
            }
            
            function createParticles()
            {
                const particlesContainer = document.querySelector('.particles-container');
                const particleCount = 25 + 10;
                
                for (let i = 0; i < particleCount; i++)
                {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    
                    particle.style.left = Math.random() * 100 + '%';
                    
                    const size = Math.random() * 5 + 3 + 2;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    
                    const duration = Math.random() * 7 + 8;
                    particle.style.animationDuration = duration + 's';
                    
                    const delay = -(Math.random() * duration);
                    particle.style.animationDelay = delay + 's';
                    
                    const colors = [
                        'rgba(255, 140, 0, 0.8)',
                        'rgba(255, 69, 0, 0.7)',
                        'rgba(255, 215, 0, 0.9)',
                        'rgba(238, 130, 238, 0.6)',
                        'rgba(255, 165, 0, 0.8)'
                    ];
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    particlesContainer.appendChild(particle);
                }
            }

            function createPentagons()
            {
                const pentagonsContainer = document.querySelector('.pentagons-container');
                const pentagonCount = 8 + 3 + 5;
                const colors = ['#FFD700', '#FFA500', '#FFE4B5', '#FFFF00', '#FFD300', '#FFFFFF'];
                const gridCols = Math.ceil(Math.sqrt(pentagonCount * 1.2));
                const gridRows = Math.ceil(pentagonCount / gridCols);
                const cellWidth = 100 / gridCols;
                const cellHeight = 100 / gridRows;
                const positions = [];

                for (let row = 0; row < gridRows; row++)
                {
                    for (let col = 0; col < gridCols; col++)
                    {
                        if (positions.length >= pentagonCount) break;
                        positions.push({ col, row });
                    }
                }
                
                for (let i = 0; i < pentagonCount; i++)
                {
                    const pentagon = document.createElement('div');
                    pentagon.className = 'pentagon';
                    
                    const gridPos = positions[i];
                    const baseX = gridPos.col * cellWidth + cellWidth / 2;
                    const baseY = gridPos.row * cellHeight + cellHeight / 2;
                    
                    const offsetX = (Math.random() - 0.5) * cellWidth * 0.8;
                    const offsetY = (Math.random() - 0.5) * cellHeight * 0.8;
                    
                    pentagon.style.left = Math.max(5, Math.min(95, baseX + offsetX)) + '%';
                    pentagon.style.top = Math.max(5, Math.min(95, baseY + offsetY)) + '%';
                    
                    const size = Math.random() * 40 + 25;
                    pentagon.style.width = size + 'px';
                    pentagon.style.height = size + 'px';
                    
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    pentagon.innerHTML = `
                        <svg viewBox="0 0 100 100">
                            <defs>
                                <linearGradient id="pentagonGradient${i}" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:${color};stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.8" />
                                </linearGradient>
                            </defs>
                            <path d="M50,5 L61,35 L95,35 L68,57 L79,91 L50,70 L21,91 L32,57 L5,35 L39,35 Z" 
                                  fill="url(#pentagonGradient${i})" />
                        </svg>
                    `;
                    
                    const delay = Math.random() * 5 + 's';
                    const duration = Math.random() * 3 + 4 + 's';
                    pentagon.style.animationDelay = delay;
                    pentagon.style.animationDuration = duration;
                    
                    const initialRotation = Math.random() * 360;
                    pentagon.style.setProperty('--initial-rotation', initialRotation + 'deg');
                    
                    pentagonsContainer.appendChild(pentagon);
                }
            }
            
            createStars();
            createParticles();
            createPentagons();
        });
    </script>
